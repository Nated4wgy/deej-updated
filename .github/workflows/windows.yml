name: Windows build and recovery release
on:
  push:
    branches: [master, 'codex/responsive-audio-settings']
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
          cache: true
      - name: Build and verify portable bundle
        shell: pwsh
        run: ./scripts/build_windows.ps1 -Version ${{ github.ref_type == 'tag' && github.ref_name || format('dev-{0}', github.sha) }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Dashboard regression checks
        shell: pwsh
        run: |
          npm ci
          if ($LASTEXITCODE -ne 0) { throw 'UI dependencies failed' }
          npm test
          if ($LASTEXITCODE -ne 0) { throw 'UI checks failed' }
      - name: Race detector
        shell: pwsh
        env:
          CGO_ENABLED: '1'
        run: |
          go test -race ./pkg/deej/...
          if ($LASTEXITCODE -ne 0) { throw 'Race tests failed' }
      - name: Package
        shell: pwsh
        run: Compress-Archive -Path bin/* -DestinationPath deej-windows-amd64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: deej-windows-amd64
          path: deej-windows-amd64.zip
          retention-days: 90
      - name: Preserve successful builds as GitHub releases
        if: github.event_name == 'push'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          COMMIT: ${{ github.sha }}
        run: |
          $tag = "dev-$env:COMMIT"
          $releaseArgs = @("--prerelease", "--title", "Development build $env:COMMIT")
          if ($env:REF_TYPE -eq 'tag') {
            $tag = $env:REF_NAME
            $releaseArgs = @("--title", $tag)
          } elseif ($env:REF_NAME -eq 'master') {
            $version = (Get-Content VERSION -Raw).Trim()
            if ($version -notmatch '^\d+\.\d+\.\d+$') { throw 'VERSION must be MAJOR.MINOR.PATCH' }
            $tag = "v$version"
            $releaseArgs = @("--title", "deej for Windows 11 $tag", "--notes-file", "RELEASE_NOTES.md", "--latest")
          }
          # Preserve stable artifacts. Later master builds must not replace them.
          if ($tag -match '^v') {
            gh release view $tag --json tagName 2>$null | Out-Null
            if ($LASTEXITCODE -eq 0) { Write-Host "Stable release $tag exists; leaving it untouched."; exit 0 }
          }
          gh release view $tag --json tagName 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag deej-windows-amd64.zip --clobber
          } else {
            gh release create $tag deej-windows-amd64.zip --target $env:COMMIT --notes "Windows build, source identity and SHA-256 checksums." @releaseArgs
          }
          if ($LASTEXITCODE -ne 0) { throw 'Release upload failed' }
